<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="photos/cronometro.ico">
  <title>CRONOSesi</title>
</head>
<body>
<div class="site-container">
    
    <aside class="faixa-esquerda"></aside>

    <main class="conteudo-principal">
      <form action="http://localhost:3000/login" method ="post">
        
        <div class="img">
          <img src="/client/photos/cronosesi.png" alt="Logo CRONOSesi">
        </div>
        <div class="login">
          <div class="email" id="email">
            <input type="text" placeholder="Email educacional" name="email">
          </div>

          <div class="senha" id="senha">
            <input type="password" placeholder="Senha" name="senha">
          </div>
        </div>
        <div id="erro"></div>
        <div class="botao" id="botao">
            <button type="submit">Login</button>
        </div>
      </form>
    </main>

    <aside class="faixa-direita">
    </aside>

</div>
</body>
<script src="script.js"></script>
</html>
