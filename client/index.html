<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>CRONOSesi</title>
</head>
<body>
<div class="site-container">
    
    <aside class="faixa-esquerda"></aside>

    <main class="conteudo-principal">
      <form action="http://localhost:3000">
        
        <div class="img">
          <img src="/client/photos/cronosesi.png" alt="Logo CRONOSesi">
        </div>
        <div class="login">
          <div class="email">
            <input type="text" placeholder="Email educacional">
          </div>

          <div class="senha">
            <input type="password" placeholder="Senha">
          </div>
        </div>
        <div class="botao">
          <button type="submit">Login</button>
        </div>
      </form>
    </main>

    <aside class="faixa-direita">
      <img src="o/client/photos/ondasfaixas.png" alt="" class="imagem-ondas">
    </aside>

</div>
</body>
</html>
